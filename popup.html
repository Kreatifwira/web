<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solitaire Pattern Recorder V2</title><link rel="stylesheet" href="popup.css"></head><body><header><div class="logo">SOLITAIRE</div><div class="title">Pattern Recorder <span>V2</span></div></header><div id="status" class="status">Siap.</div><div class="buttons"><button id="record" class="primary">● RECORD POLA</button><button id="save">＋ SIMPAN POLA</button><button id="check">⌕ CEK POLA SEKARANG</button></div><div class="options"><label>Area permainan<select id="crop"><option value="center">Tengah / papan Solitaire</option><option value="full">Seluruh halaman</option></select></label><label>Toleransi kemiripan: <b id="tolValue">90%</b><input id="tolerance" type="range" min="70" max="98" value="90"></label></div><div class="stats"><div><small>Pola tersimpan</small><b id="count">0</b></div><div><small>Hasil terakhir</small><b id="match">-</b></div></div><h3>Rekaman</h3><div id="list" class="list"></div><button id="clear" class="danger">Hapus semua pola</button><script src="popup.js"></script></body></html>
