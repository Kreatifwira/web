<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solitaire Pattern Recorder V3</title><link rel="stylesheet" href="popup.css"></head><body><header><div class="logo">SOLITAIRE</div><div class="title">Card Pattern Detector <span>V3</span></div></header><div id="status" class="status">Siap.</div><div class="buttons"><button id="record" class="primary">● RECORD POLA</button><button id="save">＋ SIMPAN POLA</button><button id="check">⌕ CEK POLA</button></div><div class="options"><label>Area papan<select id="crop"><option value="center">Tengah — rekomendasi</option><option value="full">Seluruh layar</option></select></label><label>Toleransi <b id="tolValue">88%</b><input id="tolerance" type="range" min="75" max="98" value="88"></label></div><div class="stats"><div><small>Pola</small><b id="count">0</b></div><div><small>Kemiripan</small><b id="match">-</b></div></div><h3>Zona kartu</h3><div class="legend">V3 membagi papan menjadi 25 zona dan membandingkan pola tiap zona.</div><h3>Rekaman</h3><div id="list" class="list"></div><button id="clear" class="danger">Hapus semua pola</button><script src="popup.js"></script></body></html>
