<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#202124">
<link rel="manifest" href="manifest.json">
<title>Browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="browser">
  <header class="toolbar">
    <button id="back" aria-label="Kembali">‹</button>
    <button id="forward" aria-label="Maju">›</button>
    <button id="reload" aria-label="Muat ulang">↻</button>
    <input id="url" value="https://1xraja.com/id" autocomplete="off" spellcheck="false">
    <button id="go">Buka</button>
  </header>
  <section class="page">
    <div class="logo">Chrome</div>
    <h1>Browser langsung</h1>
    <p>Website tidak dimuat di iframe. Alamat dibuka langsung oleh browser perangkat.</p>
    <button id="open" class="primary">BUKA 1XRAJA</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
