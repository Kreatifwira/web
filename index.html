<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202124"><title>Browser</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
  <div class="top">
    <div class="tabbar"><div class="tab active"><span>🌐</span><b>Tab Baru</b><button id="closeTab">×</button></div><button id="addTab" class="round">＋</button><button id="tabsBtn" class="round">▢</button></div>
    <div class="addressbar">
      <button id="back">‹</button><button id="forward">›</button>
      <div class="omnibox"><span id="lock">🔒</span><input id="address" placeholder="Cari atau masukkan alamat" autocomplete="off"><button id="clear">×</button><button id="go">➜</button></div>
      <button id="menu">⋮</button>
    </div>
  </div>
  <main id="main">
    <section id="start" class="start">
      <div class="logo">🌐</div><h1>Browser</h1><p>Cepat. Sederhana. Nyaman di HP.</p>
      <form id="search"><div class="search"><span>🔍</span><input id="query" placeholder="Cari atau masukkan alamat web"><button>→</button></div></form>
      <div class="cards"><button data-url="https://example.com">Example</button><button data-url="https://wikipedia.org">Wikipedia</button><button data-url="https://github.com">GitHub</button></div>
      <div class="info">Untuk situs yang menolak iframe, gunakan menu <b>⋮</b> → <b>Buka langsung</b>.</div>
    </section>
    <iframe id="page" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe>
    <section id="blocked" class="blocked"><div>⚠️</div><h2>Situs tidak dapat ditampilkan</h2><p>Situs ini mungkin melarang pemuatan di dalam iframe.</p><button id="direct">Buka langsung</button><button id="again">Coba lagi</button></section>
  </main>
  <nav class="bottom"><button id="home">⌂<small>Beranda</small></button><button id="reload">↻<small>Muat ulang</small></button><button id="open">↗<small>Buka langsung</small></button><button id="more">⋮<small>Menu</small></button></nav>
</div><div id="menuPanel" class="panel"><button id="direct2">↗ &nbsp; Buka langsung</button><button id="copy">🔗 &nbsp; Salin alamat</button><button id="desktop">🖥️ &nbsp; Tampilan desktop</button><button id="clearData">🗑️ &nbsp; Bersihkan riwayat lokal</button></div>
<script src="app.js"></script></body></html>
