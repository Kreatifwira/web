<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Browser</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="browser-app">
<header class="mobile-topbar">
<button id="backBtn" class="top-icon" aria-label="Kembali">‹</button>
<div class="address-bar">
<span class="site-icon">🔒</span>
<input id="urlInput" type="text" inputmode="url" autocomplete="off" spellcheck="false" value="https://example.com" placeholder="Telusuri atau masukkan alamat">
<button id="clearUrlBtn" class="url-clear">×</button>
</div>
<button id="menuBtn" class="top-icon" aria-label="Menu">⋮</button>
</header>
<div class="navigation-row">
<button id="reloadBtn" class="nav-control">↻</button>
<button id="goBtn" class="go-control">Buka</button>
</div>
<main class="browser-page">
<section id="homeScreen" class="home-screen">
<div class="browser-logo">🌐</div>
<h1>Browser</h1>
<p>Telusuri internet dalam satu tab.</p>
<form id="searchForm" class="home-search">
<span>🔍</span>
<input id="homeInput" type="text" placeholder="Telusuri atau masukkan alamat" autocomplete="off">
<button type="submit">→</button>
</form>
<div class="shortcut-grid">
<button data-url="https://example.com"><span>🌐</span><small>Example</small></button>
<button data-url="https://www.wikipedia.org"><span>📚</span><small>Wikipedia</small></button>
<button data-url="https://www.cloudflare.com"><span>☁️</span><small>Cloudflare</small></button>
<button data-url="https://github.com"><span>🐙</span><small>GitHub</small></button>
</div>
</section>
<iframe id="browserFrame" title="Browser" src="about:blank" allow="fullscreen; autoplay; clipboard-read; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="loading" class="loading"><div class="loading-spinner"></div><span>Memuat halaman...</span></div>
</main>
<div id="connectionStatus" class="connection-status">Siap</div>
<nav class="bottom-navigation">
<button id="homeBtn"><span>⌂</span><small>Beranda</small></button>
<button id="bottomBackBtn"><span>‹</span><small>Kembali</small></button>
<button id="bottomForwardBtn"><span>›</span><small>Maju</small></button>
<button id="bottomReloadBtn"><span>↻</span><small>Muat ulang</small></button>
<button id="settingsBtn"><span>⋮</span><small>Menu</small></button>
</nav>
<div id="menuOverlay" class="menu-overlay">
<div class="menu-card">
<div class="menu-header"><strong>Browser</strong><button id="closeMenuBtn">×</button></div>
<div class="menu-section">
<button id="menuHomeBtn">🏠 <span>Beranda</span></button>
<button id="menuReloadBtn">🔄 <span>Muat ulang</span></button>
<button id="copyUrlBtn">🔗 <span>Salin alamat</span></button>
</div>
<div class="menu-section">
<div class="account-title">Akun</div>
<input id="authEmail" type="email" placeholder="Email">
<input id="authPassword" type="password" placeholder="Password">
<div class="auth-buttons"><button id="loginBtn">Login</button><button id="signupBtn">Daftar</button></div>
<button id="logoutBtn" class="logout-btn">Keluar</button>
<small id="authStatus">Memeriksa akun...</small>
</div>
<div class="menu-footer"><span id="storageStatus">Browser langsung</span></div>
</div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
